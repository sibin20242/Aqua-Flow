{% extends "AUTHORITY/authoritybase.html" %}
{% block body %}
{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">

    <title>Monthly Calendar</title>
    <link rel="stylesheet" href="{% static 'css/time.css' %}">
    <style>
        /* Modal Styling */
.modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Dark overlay */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Modal Content */
.modal-content {
    position: relative;
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    width: 320px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    animation: fadeIn 0.3s ease-in-out;
}

/* Modal Header */
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid #ccc;
}

/* Close Button */
.close {
    cursor: pointer;
    font-size: 22px;
    font-weight: bold;
    color: #ff5c5c;
}

.close:hover {
    color: red;
}

/* Input Styling */
.modal input {
    margin: 15px 0;
    padding: 10px;
    width: 90%;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* Save Button */
.modal button {
    background: #007bff;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
}

.modal button:hover {
    background: #0056b3;
}

/* Fade In Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

    </style>
</head>
<body> 
<div class="body1">
    <div id="calendar">
        <div id="month">
            <button id="prev">&lt;</button>
            <span id="month-name">August 2024</span>
            <button id="next">&gt;</button>
        </div>
        <div id="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        <div id="days"></div>
    </div>


</div>
    <!-- Modal -->
    <div id="timeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="selected-date"></h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <label for="time-input">Enter Time:</label>
            <input type="time" id="time-input">
            <button onclick="saveTime()">Save</button>
        </div>
    </div>
    <script>const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
  ];
  
  let currentDate = new Date();
  
  function renderCalendar() {
      const daysContainer = document.getElementById('days');
      const monthName = document.getElementById('month-name');
      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();
      
      // Corrected template literal syntax
      monthName.textContent = `${monthNames[currentMonth]} ${currentYear}`;
      
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();
  
      daysContainer.innerHTML = "";
      
      // Fill in days from the previous month
      for (let x = firstDay; x > 0; x--) {
          const day = document.createElement('div');
          day.classList.add('inactive');
          day.textContent = daysInPrevMonth - x + 1;
          daysContainer.appendChild(day);
      }
      
      // Fill in days of the current month
      for (let i = 1; i <= daysInMonth; i++) {
          const day = document.createElement('div');
          day.textContent = i;
          day.addEventListener("click", () => openModal(i)); 
          daysContainer.appendChild(day);
      }
  
      // Calculate the number of days needed to fill the last row
      const totalBoxes = firstDay + daysInMonth;
      const totalDaysInCalendar = 42; // 6 rows of 7 days
      const remainingBoxes = totalDaysInCalendar - totalBoxes; 
      
      // Fill in days from the next month
      for (let j = 1; j <= remainingBoxes; j++) {
          const day = document.createElement('div');
          day.classList.add('inactive');
          day.textContent = j;
          daysContainer.appendChild(day);
      }
  }
  
  function changeMonth(direction) {
      currentDate.setMonth(currentDate.getMonth() + direction);
      renderCalendar();
  }
  
  document.getElementById('prev').addEventListener('click', () => changeMonth(-1));
  document.getElementById('next').addEventListener('click', () => changeMonth(1));
   // Modal Functions
   function openModal(day) {
        const selectedDate = `${day} ${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        document.getElementById("selected-date").textContent = `Selected Date: ${selectedDate}`;
        document.getElementById("timeModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("timeModal").style.display = "none";
    }

    function saveTime() {
    const selectedTime = document.getElementById("time-input").value;
    const selectedDate = document.getElementById("selected-date").textContent.replace("Selected Date: ", "");

    if (!selectedTime) {
        alert("Please enter a time.");
        return;
    }

    // Sending data to the server using AJAX
    fetch("/time/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCookie("csrftoken"),  // CSRF protection
        },
        body: `date=${selectedDate}&time=${selectedTime}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert("Error: " + data.error);
        } else {
            alert("Time set successfully!");
            closeModal();
        }
    })
    .catch(error => console.error("Error:", error));
}


// Function to get CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}


    window.onclick = function(event) {
        const modal = document.getElementById("timeModal");
        if (event.target === modal) {
            closeModal();
        }
    };
  renderCalendar();

  </script>
</body>
</html>
{% endblock %}
