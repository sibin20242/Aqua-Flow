{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Navbar with Attractive Cards</title>
  <link rel="stylesheet" href="{% static 'css/home1.css' %}">
  <!-- Font Awesome stylesheet for icon usage -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <!-- Navbar with logo and animated buttons -->
  <div class="navbar">
    <!-- Profile link with circle and username -->
    <div class="profile-container">
      <span class="username">ADMIN</span> <!-- Add the username here -->
    </div>

    <!-- Logo and name centered -->
    <div class="logo">
      <img src="{% static 'img/logo.jpg' %}" alt="Logo">
      <span class="logo-text">AQUA FLOW</span>
    </div>

    <!-- Logout link with icon -->
    <div class="nav-links">
      <a href="#" id="logout-link">
        <i class="fa-solid fa-right-from-bracket"></i> LOGOUT
      </a>
    </div>
  </div>

  <!-- Logout Warning Modal -->
  <div id="logout-modal" class="modal">
    <div class="modal-content">
      <h3>Are you sure you want to logout?</h3>
      <div class="modal-buttons">
        <button class="confirm" onclick="logout()">Yes, Logout</button>
        <button class="cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Main content (cards and other sections) -->
  <main id="main-content">
    <div class="card">
      <div class="car"><a href="/addlist1"><i class="fa-solid fa-user-tie icon"></i><input type="text" value="AUTHORITY" readonly></a></div>
      <div class="car"><a href="/user"><i class="fa-solid fa-user-large icon"></i><input type="text" value="USER" readonly></a></div>
      <div class="car"><a href="/addlist"><i class="fa-solid fa-users icon"></i><input type="text" value="STAFF" readonly></a></div>
      <div class="car"><a href="/adminarea"><i class="fa-solid fa-location-dot icon"></i><input type="text" value="AREA" readonly></a></div>
      <div class="car"><a href="/feedback"><i class="fa-solid fa-comment-dots icon"></i><input type="text" value="FEEDBACK" readonly></a></div>
      <div class="car"><a href="/complaint"><i class="fa-solid fa-exclamation-circle icon"></i><input type="text" value="COMPLAINTS" readonly></a></div>
      <div class="car"><a href="/userchat"><i class="fa-solid fa-comments icon"></i><input type="text" value="CHAT" readonly></a></div>
    </div>
  </main>

  <script>
    // JavaScript for handling the logout modal
    const logoutModal = document.getElementById('logout-modal');
    const logoutLink = document.getElementById('logout-link');

    // Open the logout modal
    logoutLink.addEventListener('click', (e) => {
      e.preventDefault(); // Prevent default link behavior
      logoutModal.style.display = 'flex';
    });

    // Close the logout modal
    function closeModal() {
      logoutModal.style.display = 'none';
    }

    // Logout function
    function logout() {
      alert('You have been logged out.'); // Replace with actual logout logic
      window.location.href = '{% url "login" %}'; // Redirect to login page
    }
  </script>
</body>
</html>
