{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #009FFD, #2A2A72);
        }

        /* Navbar */
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
        }

        .navbar .logo img {
            height: 40px;
            width: auto;
            margin-right: 10px;
        }

        .navbar .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .navbar .prof i {
            font-size: 22px;
            color: white;
            cursor: pointer;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            text-align: center;
            width: 350px;
        }

        .card h2 {
            color: white;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Form Inputs */
        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-bottom: 2px solid white;
            background: transparent;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            border-bottom: 2px solid #00C9FF;
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 12px;
            background: #0078FF;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        button:hover {
            background: #005FCC;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">
            <img src="{% static 'logo.jpg' %}" alt="Logo">
            <span class="logo-text">AQUA FLOW</span>
        </div>
        <span class="prof"><i class="fas fa-user"></i></span>
    </div>

    <!-- Forgot Password Form -->
    <div class="card">
        <h2>Forgot Password</h2>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit" >Send OTP</button>
        </form>
    </div>

</body>
</html>
