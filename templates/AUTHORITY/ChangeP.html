{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqua Flow - Password Change</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: rgba(23, 43, 114, 0.5); 
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: #0B0421;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid white;
      margin-right: 10px;
    }

    .logo-text {
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100vh;
      background-color: #0B0421;
      transition: 0.3s ease;
      padding-top: 70px;
    }

    .sidebar a {
      display: block;
      padding: 15px;
      color: white;
      font-size: 18px;
      text-decoration: none;
      transition: 0.3s;
    }

    .sidebar a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      padding-left: 25px;
    }

    .toggle-btn {
      position: absolute;
      left: 20px;
      font-size: 24px;
      cursor: pointer;
      color: white;
    }

    /* Password Change Form */
    .card {
      background: rgba(255, 255, 255, 0.2);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .card h2 {
      color: white;
      margin-bottom: 15px;
    }

    .input-group {
      margin-bottom: 15px;
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.8);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: gray;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #021A4A;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #033372;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 200px;
      }

      .toggle-btn {
        font-size: 20px;
      }

      .card {
        max-width: 90%;
      }
    }
  </style>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <span class="toggle-btn" onclick="toggleSidebar()">
      <i class="fa fa-bars"></i>
    </span>
    <div class="logo">
      <img src="{% static 'img/logo.jpg' %}" alt="Logo">
      <span class="logo-text">AQUA FLOW</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <a href="/profile/{{request.session.userid}}">PROFILE</a>
    <a href="/feedback">FEEDBACK</a>
    <a href="/complaint">COMPLAINTS</a>
    <a href="/chat">CHAT</a>
    <a href="/logout">LOGOUT</a>
  </div>

  <!-- Password Change Form -->
  <form class="card" action="" method="post">
    <h2>Change Password</h2>
    
    <div class="input-group">
      <input type="password" placeholder="Current Password" name="current_password" id="current_password">
      <i class="fa fa-eye toggle-password" onclick="togglePassword('current_password')"></i>
    </div>

    <div class="input-group">
      <input type="password" placeholder="New Password" name="new_password" id="new_password">
      <i class="fa fa-eye toggle-password" onclick="togglePassword('new_password')"></i>
    </div>

    <div class="input-group">
      <input type="password" placeholder="Re-Enter Password" name="confirm_password" id="confirm_password">
      <i class="fa fa-eye toggle-password" onclick="togglePassword('confirm_password')"></i>
    </div>

    <button type="submit" class="btn">Change Password</button>
  </form>

  <script>
    let isSidebarOpen = false;

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      if (isSidebarOpen) {
        sidebar.style.left = "-250px";
      } else {
        sidebar.style.left = "0";
      }
      isSidebarOpen = !isSidebarOpen;
    }

    function togglePassword(id) {
      let input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
