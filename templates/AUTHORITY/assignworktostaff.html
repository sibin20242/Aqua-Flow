<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Work to Staff</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e3f2fd; /* Light Blue */
            color: #1a237e; /* Deep Blue */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #1565c0; /* Darker Blue */
            margin-bottom: 15px;
        }

        /* Staff Selection */
        .staff-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .staff-list li {
            background: #bbdefb;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .staff-list li:hover {
            background: #64b5f6;
            color: white;
        }

        /* Input Fields */
        .form-group {
            margin: 10px 0;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #0d47a1;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 2px solid #90caf9;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #1976d2;
            outline: none;
        }

        /* Assign Button */
        .assign-btn {
            background: #1e88e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .assign-btn:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Assign Work to Staff</h2>

       
        <!-- Work Assignment Form -->
        <div class="form-group">
            <form method="post">
                {% csrf_token %}
            <label for="staff">Selected Staff:</label>
            <select name="staffid">
                {% for i in c %}
                <option value="{{i.id}}" >{{ i.First_name }} {{ i.Mid_name }} {{ i.Last_name }}</option>
                {% endfor%}
            </select>
        </div>
           
        <div class="form-group">
            <label for="task">Task Description:</label>
           <input type="text" value="{{ o.Complaints }}" readonly >

        <button class="assign-btn" type="submit">Assign Work</button>
        </form>
    </div>


</body>
</html>
